apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: New Workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        default: default value goes here
        required: true
jobs:
  ci-job:
    steps:
      - run: |
          git config --global --add safe.directory /cloudbees/workspace
        uses: docker://alpine/git:latest
      - uses: https://github.com/cloudbees-io/checkout@v1
        name: checkout
      - run: |
          go build -v ./...
        uses: docker://golang:1.20
        name: Build Go app
      - run: |
          go test -v ./...
        uses: docker://golang:1.20
        name: Run tests
